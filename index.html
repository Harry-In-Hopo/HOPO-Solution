        }
        
        .header p {

        }

            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);

        }
        
        .input-section {
            padding: 40px;
            background: #f8fafc;

        }

            color: #1e293b;
            margin-bottom: 25px;

        }

            display: grid;

        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {

            color: #475569;

        }

            border-color: #667eea;

        }
        
        .form-group .hint {

            color: #94a3b8;

        }

            font-weight: 600;

            margin-top: 20px;
            width: 100%;
            max-width: 300px;
            align-self: center;
        }

        }

            transform: translateY(0);
        }

            padding: 40px;
            display: none;
        }

            display: block;
        }

        }

        }

        .hardware-table td {

        }

        }
        
        .hardware-table tr:hover {

        }

            border-radius: 20px;

            font-weight: 600;
        }

        .category-width { background: #d1fae5; color: #065f46; }

                            <label>适用范围</label>

                            </div>
                            <span class="hint">若超出范围请联系技术支持</span>
                        </div>
                        
                        <div class="form-group" id="widthInputGroup">
                            <label for="windowWidth">门窗宽度 (mm)</label>
                            <input type="number" id="windowWidth" min="455" max="970" placeholder="例如: 600" required>
                            <span class="hint">输入实际尺寸</span>
                        </div>
                        
                        <div class="form-group" id="heightInputGroup">
                            <label for="windowHeight">门窗高度 (mm)</label>
                            <input type="number" id="windowHeight" min="655" max="3000" placeholder="例如: 1200" required>
                            <span class="hint">输入实际尺寸</span>
                        </div>
                    </div>
                    
                    <div style="text-align: center;">
                        <button type="submit" class="btn-primary">🔍 查询五金配置</button>
                    </div>
                </form>
            </div>

                </div>
                
                <div id="warningBox"></div>
                <div id="infoBox"></div>

                    <thead>
                        <tr>
                            <th style="width: 220px;">产品名称</th>
                            <th style="width: 180px;">产品编号</th>
                            <th style="width: 80px;">单位</th>
                            <th style="width: 80px;">数量</th>
                            <th>备注说明</th>
                        </tr>
                    </thead>
                    <tbody id="hardwareBody">

                </table>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button class="export-btn" onclick="exportResult()">📥 导出配置清单</button>
                </div>
            </div>
        </div>

                    { name: '微内开侧滑推拉单向缓冲器', code: 'BD403.26.38X', unit: '套', qty: 1, note: '选配：单扇选配1套，对开扇选配2套' }

                    { name: '悬挂外开传动壳', code: 'AGC50.26.06WA4', unit: '个', qty: 1, note: '有26/30/37mm中心距' },
                    { name: 'C槽隐藏式悬挂外开（左）Pro', code: 'CTA80.20.38LWA5', unit: '套', qty: 1, note: '开启角度85°，承重80KG，左边' },
                    { name: 'C槽隐藏式悬挂外开（右）Pro', code: 'CTA80.20.38RWA5', unit: '套', qty: 1, note: '开启角度85°，承重80KG，右边' }

                    { name: 'ALR28滚套锁杆', code: 'ALR28.65.031WA4', unit: '个', qty: 1, note: '' },
                    { name: 'C槽锁座', code: 'ALP10.00.031WA4', unit: '个', qty: 1, note: '' }
                ]

        };

        // ============== 全局变量 ==============
        let currentResult = null;

        // ============== 核心匹配逻辑 ==============
        function calculateHardware(width, height, windowType, slidingConfig) {
            const result = {
                basic: [],
                heightAddons: [],
                widthAddons: [],
                backLock: [],
                windBrace: [],
                warnings: [],
                infos: []
            };
            
            // 根据门窗类型选择不同配置
            if (windowType === 'g24-sliding') {
                // G24窄边推拉门配置
                const config = slidingConfig === 'four-panel' 
                    ? CONFIG.g24Sliding.fourPanel 
                    : CONFIG.g24Sliding.twoPanel;
                
                result.basic = config.map(item => ({
                    ...item,
                    category: 'basic',
                    categoryName: '基础配置'
                }));
                
                // 检查尺寸范围
                if (width < CONFIG.g24Sliding.range.minWidth || width > CONFIG.g24Sliding.range.maxWidth) {
                    result.warnings.push(`扇宽 ${width}mm 超出G24推拉门范围(400-2500mm)`);
                }
                if (height < CONFIG.g24Sliding.range.minHeight || height > CONFIG.g24Sliding.range.maxHeight) {
                    result.warnings.push(`扇高 ${height}mm 超出G24推拉门范围(600-2600mm)`);
                }
                
                // 添加滑轮二选一提示
                result.infos.push('滑轮轻型/重型二选一，根据实际需求选择');
                
            } else if (windowType === 'g45-sliding') {
                // G45推拉密封窗配置
                const isConfig1 = slidingConfig === 'config1';
                const mainConfig = isConfig1 ? CONFIG.g45Sliding.config1 : CONFIG.g45Sliding.config2;
                const optionalConfig = isConfig1 ? CONFIG.g45Sliding.config1Optional : CONFIG.g45Sliding.config2Optional;
                
                result.basic = mainConfig.map(item => ({
                    ...item,
                    category: 'basic',
                    categoryName: '基础配置'
                }));
                
                result.backLock = optionalConfig.map(item => ({
                    ...item,
                    category: 'optional',
                    categoryName: '选配件'
                }));
                
                // 检查尺寸范围
                if (width < CONFIG.g45Sliding.range.minWidth || width > CONFIG.g45Sliding.range.maxWidth) {
                    result.warnings.push(`扇宽 ${width}mm 超出G45推拉密封窗范围(500-1050mm)`);
                }
                if (height < CONFIG.g45Sliding.range.minHeight || height > CONFIG.g45Sliding.range.maxHeight) {
                    result.warnings.push(`扇高 ${height}mm 超出G45推拉密封窗范围(800-2600mm)`);
                }
                
                // 配置一的勾边锁座二选一提示
                if (isConfig1) {
                    result.infos.push('勾边锁座/勾边可调锁座二选一，根据型材结构选择');
                }
                
            } else if (windowType === 'hanging-open') {
                // 悬挂外开窗配置
                result.basic = CONFIG.hangingOpen.basic.map(item => ({
                    ...item,
                    category: 'basic',
                    categoryName: '基础配置'
                }));
                
                result.backLock = CONFIG.hangingOpen.optional.map(item => ({
                    ...item,
                    category: 'optional',
                    categoryName: '选配件'
                }));
                
                // 左右铰链二选一提示
                result.infos.push('隐藏式悬挂外开（左）/（右）二选一，根据安装位置选择');
                
            } else {
                // UC槽内开内倒窗配置（默认）
                // 1. 基础配置
                result.basic = CONFIG.basicHardware.map(item => ({
                    ...item,
                    category: 'basic',
                    categoryName: '基础配置'
                }));
                
                // 检查基础范围
                const inBasicWidthRange = width >= CONFIG.basicRange.minWidth && width <= CONFIG.basicRange.maxWidth;
                const inBasicHeightRange = height >= CONFIG.basicRange.minHeight && height <= CONFIG.basicRange.maxHeight;
                
                if (!inBasicWidthRange && width > CONFIG.basicRange.maxWidth && width <= CONFIG.widthAddons.range.max) {
                    result.warnings.push(`扇宽 ${width}mm 超出基础范围(455-720mm)，需要增购扇宽匹配五金`);
                }
                
                if (!inBasicHeightRange && height > CONFIG.basicRange.maxHeight) {
                    result.warnings.push(`扇高 ${height}mm 超出基础范围(655-925mm)，需要增购扇高匹配五金`);
                }
                
                // 2. 扇高增购
                for (const addon of CONFIG.heightAddons) {
                    if (height > addon.range.min && height <= addon.range.max) {
                        result.heightAddons = addon.items.map(item => ({
                            ...item,
                            category: 'height',
                            categoryName: '扇高增购'
                        }));
                        break;
                    }
                }
                
                // 3. 扇宽增购
                if (width > CONFIG.widthAddons.range.min && width <= CONFIG.widthAddons.range.max) {
                    const recommendedOption = CONFIG.widthAddons.options[0];
                    result.widthAddons = recommendedOption.items.map(item => ({
                        ...item,
                        category: 'width',
                        categoryName: '扇宽增购'
                    }));
                    result.infos.push(`扇宽增购有两种方案可选，当前显示推荐方案一。方案二可选：250mm延长端（无锁点）x1`);
                }
                
                // 4. 背部锁增购（可选）
                const backLockOption = CONFIG.backLockAddons[0];
                result.backLock = backLockOption.items.map(item => ({
                    ...item,
                    category: 'backlock',
                    categoryName: '背部锁（可选）'
                }));
                
                if (height > 925) {
                    const option2 = CONFIG.backLockAddons[1];
                    for (const rule of option2.heightRules) {
                        if (height > rule.range.min && height <= rule.range.max) {
                            result.infos.push(`背部锁方案二可选：联动背部锁延长端，需增配 ${rule.sets} 套500mm延长端（防撬锁点）`);
                            break;
                        }
                    }
                }
                
                // 5. 风撑增购（可选）
                if (width >= CONFIG.windBrace.minWidth) {
                    result.windBrace = [{
                        ...CONFIG.windBrace.item,
                        category: 'wind',
                        categoryName: '风撑（可选）'
                    }];
                }
            }
            
            return result;
        }

        // ============== UI 渲染 ==============
        function renderResult(result, width, height, windowType) {
            const tbody = document.getElementById('hardwareBody');
            tbody.innerHTML = '';
            
            // 合并所有配置项
            let allItems = [
                ...result.basic,
                ...result.heightAddons,
                ...result.widthAddons,
                ...result.backLock,
                ...result.windBrace
            ];
            
            // 合并相同产品，处理L/R配对和延长端配对（都是二选一）
            const mergedItems = {};
            allItems.forEach(item => {
                // 检测是否是L/R配对的产品
                let baseName = item.name;
                let isOptionPair = false;
                let pairType = '';
                
                // 匹配名称末尾的 L 或 R（可能有空格）
                const lrMatch = item.name.match(/^(.+?)\s*[LR]$/i);
                if (lrMatch) {
                    baseName = lrMatch[1].trim();
                    isOptionPair = true;
                    pairType = 'LR';
                }
                
                // 匹配延长端配对：如 "250mm延长端（无锁点）" 和 "250mm延长端（防撬锁点）"
                const extMatch = item.name.match(/^(.+?延长端)（.+）$/);
                if (extMatch) {
                    baseName = extMatch[1].trim();
                    isOptionPair = true;
                    pairType = 'EXTEND';
                }
                
                // 匹配备注含"二选一"的产品：如勾边锁座和勾边可调锁座
                if (!isOptionPair && item.note && item.note.includes('二选一')) {
                    // 提取名称中的共同前缀（去掉最后一个括号内容或后缀差异）
                    const bracketMatch = item.name.match(/^(.+?)(可调)?(.+)$/);
                    if (bracketMatch) {
                        // 尝试找到同类产品
                        const hasPair = allItems.some(other => 
                            other !== item && 
                            other.note && other.note.includes('二选一') &&
                            other.name !== item.name &&
                            (other.name.includes(bracketMatch[1]) || item.name.includes(other.name.replace('可调', '')))
                        );
                        if (hasPair) {
                            // 用更通用的基础名称
                            baseName = item.name.replace('可调', '');
                            isOptionPair = true;
                            pairType = 'NOTE_OPTION';
                        }
                    }
                }
                
                // 对于配对产品，使用基础名称作为key
                const key = isOptionPair ? `OPTION_PAIR|${pairType}|${baseName}` : `${item.name}|${item.code}`;
                
                if (mergedItems[key]) {
                    if (isOptionPair) {
                        // 配对产品，合并编号，数量保持1，备注"二选一"
                        mergedItems[key].codes.push(item.code);
                        mergedItems[key].note = '二选一';
                    } else {
                        // 普通产品，累加数量
                        mergedItems[key].qty += item.qty;
                        if (item.note && !mergedItems[key].note.includes(item.note)) {
                            mergedItems[key].note = mergedItems[key].note 
                                ? mergedItems[key].note + '; ' + item.note 
                                : item.note;
                        }
                    }
                } else {
                    mergedItems[key] = { 
                        ...item, 
                        name: isOptionPair ? baseName : item.name,
                        codes: [item.code],
                        note: isOptionPair ? '二选一' : item.note
                    };
                }
            });
            
            // 转换为数组并渲染
            Object.values(mergedItems).forEach(item => {
                const tr = document.createElement('tr');
                const codeDisplay = item.codes ? item.codes.join(' / ') : item.code;
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td><span class="product-code">${codeDisplay}</span></td>
                    <td>${item.unit}</td>
                    <td><strong>${item.qty}</strong></td>
                    <td><span class="note-text">${item.note || '-'}</span></td>
                `;
                tbody.appendChild(tr);
            });
            
            // 渲染警告和提示
            const warningBox = document.getElementById('warningBox');
            const infoBox = document.getElementById('infoBox');
            
            warningBox.innerHTML = result.warnings.map(w => 
                `<div class="warning-box"><p>⚠️ ${w}</p></div>`
            ).join('');
            
            infoBox.innerHTML = result.infos.map(i => 
                `<div class="info-box"><p>💡 ${i}</p></div>`
            ).join('');
            
            // 更新输入摘要
            const typeName = windowType === 'g24-sliding' ? 'G24窄边推拉门' : windowType === 'g45-sliding' ? 'G45推拉密封窗' : windowType === 'hanging-open' ? '悬挂外开窗' : 'UC槽内开内倒窗';
            if (windowType === 'g24-sliding' || windowType === 'g45-sliding' || windowType === 'hanging-open') {
                document.getElementById('inputSummary').textContent = typeName;
            } else {
                document.getElementById('inputSummary').textContent = 
                    `${typeName} | 宽度: ${width}mm | 高度: ${height}mm`;
            }
        }

        // ============== 事件处理 ==============
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('windowType').value;
            const slidingConfig = document.getElementById('slidingConfig').value;
            
            // G24、G45、悬挂外开不需要输入尺寸，直接显示配置
            let width, height;
            if (type === 'g24-sliding' || type === 'g45-sliding' || type === 'hanging-open') {
                width = 0;
                height = 0;
            } else {
                // UC槽需要验证尺寸
                width = parseInt(document.getElementById('windowWidth').value);
                height = parseInt(document.getElementById('windowHeight').value);
                
                if (width < 455 || width > 970) {
                    alert('门窗宽度应在 455mm ~ 970mm 范围内');
                    return;
                }
                if (height < 655 || height > 3000) {
                    alert('门窗高度应在 655mm ~ 3000mm 范围内');
                    return;
                }
            }
            
            // 计算配置
            currentResult = calculateHardware(width, height, type, slidingConfig);
            
            // 渲染结果
            renderResult(currentResult, width, height, type);
            
            // 显示结果区域
            document.getElementById('resultSection').classList.add('show');
            
            // 滚动到结果
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        });

        // 门窗类型切换事件
        document.getElementById('windowType').addEventListener('change', function() {
            const slidingConfigGroup = document.getElementById('slidingConfigGroup');
            const slidingConfig = document.getElementById('slidingConfig');
            const slidingConfigHint = document.getElementById('slidingConfigHint');
            const sizeRangeGroup = document.getElementById('sizeRangeGroup');
            const sizeRangeDisplay = document.getElementById('sizeRangeDisplay');
            const widthInputGroup = document.getElementById('widthInputGroup');
            const heightInputGroup = document.getElementById('heightInputGroup');
            const windowWidth = document.getElementById('windowWidth');
            const windowHeight = document.getElementById('windowHeight');
            
            if (this.value === 'g24-sliding') {
                // G24: 显示配置选择，隐藏尺寸输入，显示适用范围
                slidingConfigGroup.style.display = 'flex';
                slidingConfig.innerHTML = '<option value="two-panel">两轨两扇</option><option value="four-panel">两轨四扇对碰</option>';
                slidingConfigHint.textContent = '选择推拉门的配置方案';
                sizeRangeGroup.style.display = 'flex';
                sizeRangeDisplay.innerHTML = '扇宽: 400 ~ 2500 mm<br>扇高: 600 ~ 2600 mm';
                widthInputGroup.style.display = 'none';
                heightInputGroup.style.display = 'none';
                windowWidth.removeAttribute('required');
                windowHeight.removeAttribute('required');
            } else if (this.value === 'g45-sliding') {
                // G45: 固定配置一，隐藏尺寸输入，显示适用范围
                slidingConfigGroup.style.display = 'none';
                sizeRangeGroup.style.display = 'flex';
                sizeRangeDisplay.innerHTML = '扇宽: 500 ~ 1050 mm<br>扇高: 800 ~ 2600 mm';
                widthInputGroup.style.display = 'none';
                heightInputGroup.style.display = 'none';
                windowWidth.removeAttribute('required');
                windowHeight.removeAttribute('required');
            } else if (this.value === 'hanging-open') {
                // 悬挂外开: 隐藏尺寸输入，显示适用范围
                slidingConfigGroup.style.display = 'none';
                sizeRangeGroup.style.display = 'flex';
                sizeRangeDisplay.innerHTML = '扇宽: 510 ~ 900 mm<br>扇高: 665 ~ 2000 mm';
                widthInputGroup.style.display = 'none';
                heightInputGroup.style.display = 'none';
                windowWidth.removeAttribute('required');
                windowHeight.removeAttribute('required');
            } else {
                slidingConfigGroup.style.display = 'none';
                // UC槽: 显示尺寸输入，隐藏适用范围
                slidingConfigGroup.style.display = 'none';
                sizeRangeGroup.style.display = 'none';
                widthInputGroup.style.display = 'flex';
                heightInputGroup.style.display = 'flex';
                windowWidth.setAttribute('required', 'required');
                windowHeight.setAttribute('required', 'required');
                windowWidth.min = 455;
                windowWidth.max = 970;
                windowHeight.min = 655;
                windowHeight.max = 3000;
            }
        });

        // 导出功能
        function exportResult() {
            if (!currentResult) return;
            
            const width = document.getElementById('windowWidth').value;
            const height = document.getElementById('windowHeight').value;
            
            // 合并所有项目
            let allItems = [
                ...currentResult.basic,
                ...currentResult.heightAddons,
                ...currentResult.widthAddons,
                ...currentResult.backLock,
                ...currentResult.windBrace
            ];
            
            // 合并相同产品，处理L/R配对和延长端配对（都是二选一）
            const mergedItems = {};
            allItems.forEach(item => {
                // 检测是否是L/R配对的产品
                let baseName = item.name;
                let isOptionPair = false;
                let pairType = '';
                
                const lrMatch = item.name.match(/^(.+?)\s*[LR]$/i);
                if (lrMatch) {
                    baseName = lrMatch[1].trim();
                    isOptionPair = true;
                    pairType = 'LR';
                }
                
                // 匹配延长端配对
                const extMatch = item.name.match(/^(.+?延长端)（.+）$/);
                if (extMatch) {
                    baseName = extMatch[1].trim();
                    isOptionPair = true;
                    pairType = 'EXTEND';
                }
                
                const key = isOptionPair ? `OPTION_PAIR|${pairType}|${baseName}` : `${item.name}|${item.code}`;
                
                if (mergedItems[key]) {
                    if (isOptionPair) {
                        mergedItems[key].codes.push(item.code);
                        mergedItems[key].note = '二选一';
                    } else {
                        mergedItems[key].qty += item.qty;
                        if (item.note && !mergedItems[key].note.includes(item.note)) {
                            mergedItems[key].note = mergedItems[key].note 
                                ? mergedItems[key].note + '; ' + item.note 
                                : item.note;
                        }
                    }
                } else {
                    mergedItems[key] = { 
                        ...item, 
                        name: isOptionPair ? baseName : item.name,
                        codes: [item.code],
                        note: isOptionPair ? '二选一' : item.note
                    };
                }
            });
            
            let text = `HOPO 门窗五金配置清单\n`;
            text += `========================\n\n`;
            text += `门窗类型: UC槽内开内倒窗\n`;
            text += `门窗宽度: ${width}mm\n`;
            text += `门窗高度: ${height}mm\n\n`;
            text += `========================\n\n`;
            
            text += `【五金配置清单】\n`;
            Object.values(mergedItems).forEach(item => {
                const codeDisplay = item.codes ? item.codes.join(' / ') : item.code;
                const noteDisplay = item.note ? ` (${item.note})` : '';
                text += `${item.name} | ${codeDisplay} | ${item.qty}${item.unit}${noteDisplay}\n`;
            });
            
            if (currentResult.warnings.length > 0) {
                text += `\n【注意事项】\n`;
                currentResult.warnings.forEach(w => {
                    text += `⚠️ ${w}\n`;
                });
            }

杆TL(D7)","code":"LPE45.07.12C069","unit":"个","qty":2,"note":"7mm直径、锁点高度12mm","category":"纱门配置","serial":"4"},{"name":"重型锁座","code":"SLP47.03.069","unit":"个","qty":2,"note":"夹持式+螺丝固定、锁点伸进量7mm","category":"纱门配置","serial":"5"},{"name":"滑轮","code":"R12.121805.07H5","unit":"个","qty":4,"note":"两轮-12m宽，18.1mm高，可调至23.1mm，承重80KG","category":"纱门配置","serial":"6"}]},{"group":"G30 窄边提升推拉系列配置方案","name":"极窄三联动系列配置方案","items":[{"name":"极窄推拉三联动主体","code":"AHR52.00.031X","unit":"套","qty":1,"note":"黑色","category":"基础配置","serial":"1"},{"name":"极窄推拉导向轮","code":"RGP11.00.38X","unit":"个","qty":4,"note":"不锈钢颜色","category":"基础配置","serial":"2"},{"name":"33#滑轮四轮","code":"R33.191403.38X","unit":"个","qty":6,"note":"单个承重80KG","category":"基础配置","serial":"3-1"},{"name":"32#滑轮双轮","code":"R32.191403.38X","unit":"个","qty":6,"note":"单个承重60KG","category":"基础配置","serial":"3-2"},{"name":"单向缓冲器","code":"BD401.26.38X","unit":"套","qty":2,"note":"不锈钢颜色","category":"基础配置","serial":"4"}]}];

        var currentExcelPlan = null;

        function isExcelConfigType(value) {
            return /^excel-config-\d+$/.test(value || '');
        }

        function getExcelConfigIndex(value) {
            const match = (value || '').match(/^excel-config-(\d+)$/);
            return match ? parseInt(match[1], 10) : -1;
        }

        function getExcelConfigPlan(value) {
            const index = getExcelConfigIndex(value);
            return index >= 0 ? EXCEL_CONFIG_PLANS[index] : null;
        }

        function cleanConfigLabel(text) {
            return (text || '')
                .replace(/（\s*非?主推\s*）/g, '')
                .replace(/\(\s*非?主推\s*\)/g, '')
                .replace(/\s*非?主推\s*/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function shouldShowInWindowType(plan) {
            const group = cleanConfigLabel(plan.group);
            const name = cleanConfigLabel(plan.name);
            const text = `${group} ${name}`;
            const hiddenKeywords = [
                '爆款',
                '单品',
                '其他可选滑轮',
                '其他可选配件',
                '其他配件',
                '可选配件',
                '选配件',
                '选配方案',
                '方案选配',
                '数量选配'
            ];

            if (name === '选配' || group === '选配') return false;
            return !hiddenKeywords.some(keyword => text.includes(keyword));
        }

        function appendExcelConfigOptions() {
            const select = document.getElementById('windowType');
            if (!select || select.dataset.excelConfigsLoaded === 'true') return;

            const groups = new Map();
            const visiblePlans = EXCEL_CONFIG_PLANS
                .map((plan, index) => ({ plan, index }))
                .filter(({ plan }) => shouldShowInWindowType(plan));

            visiblePlans.forEach(({ plan, index }) => {
                if (!groups.has(plan.group)) groups.set(plan.group, []);
                groups.get(plan.group).push({ plan, index });
            });

            groups.forEach((entries, groupName) => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = cleanConfigLabel(groupName);
                entries.forEach(({ plan, index }) => {
                    const option = document.createElement('option');
                    option.value = `excel-config-${index}`;
                    option.textContent = cleanConfigLabel(plan.name);
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            });

            const hint = select.parentElement.querySelector('.hint');
            if (hint) hint.textContent = `原有智能计算类型 + ${visiblePlans.length} 个新增配置方案`;
            select.dataset.excelConfigsLoaded = 'true';
        }

        function buildExcelConfigResult(plan) {
            const items = plan.items.map(item => {
                const categoryName = item.category || '基础配置';
                let note = item.note || '';
                if (categoryName !== '基础配置') {
                    note = note ? `${categoryName}：${note}` : categoryName;
                }
                if (item.serial) {
                    note = note ? `${note}；表内序号 ${item.serial}` : `表内序号 ${item.serial}`;
                }
                return {
                    name: item.name,
                    code: item.code,
                    unit: item.unit || '个',
                    qty: item.qty || 1,
                    note,
                    category: 'basic',
                    categoryName
                };
            });

            return {
                basic: items,
                heightAddons: [],
                widthAddons: [],
                backLock: [],
                windBrace: [],
                warnings: [],
                infos: [
                    `配置分组：${cleanConfigLabel(plan.group)}`,
                    '该方案按配置清单输出；尺寸范围、左右/轻重/颜色等选择请参考备注。'
                ]
            };
        }

        function showExcelConfigFormState(plan) {
            document.getElementById('slidingConfigGroup').style.display = 'none';
            document.getElementById('sizeRangeGroup').style.display = 'none';
            document.getElementById('widthInputGroup').style.display = 'none';
            document.getElementById('heightInputGroup').style.display = 'none';
            document.getElementById('windowWidth').removeAttribute('required');
            document.getElementById('windowHeight').removeAttribute('required');
            currentExcelPlan = plan;
        }

        document.getElementById('windowType').addEventListener('change', function(e) {
            if (!isExcelConfigType(this.value)) {
                currentExcelPlan = null;
                return;
            }

            const plan = getExcelConfigPlan(this.value);
            if (!plan) return;
            e.stopImmediatePropagation();
            showExcelConfigFormState(plan);
        }, true);

        document.getElementById('configForm').addEventListener('submit', function(e) {
            const type = document.getElementById('windowType').value;
            if (!isExcelConfigType(type)) return;

            const plan = getExcelConfigPlan(type);
            if (!plan) return;
            e.preventDefault();
            e.stopImmediatePropagation();

            currentExcelPlan = plan;
            currentResult = buildExcelConfigResult(plan);
            renderResult(currentResult, 0, 0, type);
            document.getElementById('inputSummary').textContent = `${cleanConfigLabel(plan.group)} | ${cleanConfigLabel(plan.name)}`;
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }, true);

        var exportOriginalResult = exportResult;
        exportResult = function() {
            if (!currentExcelPlan || !currentResult) {
                exportOriginalResult();
                return;
            }

            const allItems = [
                ...currentResult.basic,
                ...currentResult.heightAddons,
                ...currentResult.widthAddons,
                ...currentResult.backLock,
                ...currentResult.windBrace
            ];

            let text = `HOPO 门窗五金配置清单\n`;
            text += `========================\n\n`;
            text += `配置分组: ${cleanConfigLabel(currentExcelPlan.group)}\n`;
            text += `配置方案: ${cleanConfigLabel(currentExcelPlan.name)}\n\n`;
            text += `========================\n\n`;
            text += `【五金配置清单】\n`;
            allItems.forEach(item => {
                const noteDisplay = item.note ? ` (${item.note})` : '';
                text += `${item.name} | ${item.code} | ${item.qty}${item.unit}${noteDisplay}\n`;
            });
            if (currentResult.infos.length > 0) {
                text += `\n【补充说明】\n`;
                currentResult.infos.forEach(i => { text += `💡 ${i}\n`; });
            }
            text += `\n========================\n`;
            text += `生成时间: ${new Date().toLocaleString()}\n`;
            text += `HOPO 门窗五金智能选配系统\n`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safeName = cleanConfigLabel(currentExcelPlan.name).replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
            a.href = url;
            a.download = `HOPO五金配置_${safeName}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        appendExcelConfigOptions();
        // ============== Excel导入配置库结束 ==============</script>
