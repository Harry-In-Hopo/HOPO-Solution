<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOPO 门窗五金智能选配系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(220, 38, 38, 0.14), transparent 30%),
                linear-gradient(180deg, #fff7f7 0%, #f8fafc 42%, #eef2f7 100%);
            color: #0f172a;
            min-height: 100vh;
            padding: 24px;
        }

        html.custom-cursor-ready,
        html.custom-cursor-ready * {
            cursor: none !important;
        }

        .custom-cursor {
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .custom-cursor {
                --cursor-x: 0px;
                --cursor-y: 0px;
                position: fixed;
                top: 0;
                left: 0;
                z-index: 99999;
                display: block;
                width: 86px;
                height: 58px;
                pointer-events: none;
                opacity: 0;
                transform: translate3d(var(--cursor-x), var(--cursor-y), 0) translate(-28px, -22px);
                transition: opacity 0.16s ease;
                will-change: transform;
            }

            .custom-cursor.is-visible {
                opacity: 1;
            }

            .custom-cursor__handle {
                width: 100%;
                height: 100%;
                overflow: visible;
                transform-origin: 32% 36%;
                filter: drop-shadow(0 6px 8px rgba(127, 29, 29, 0.26));
                transition: filter 0.18s ease, transform 0.18s ease;
            }

            .cursor-handle-lever {
                transform-box: view-box;
                transform-origin: 31px 24px;
            }

            .custom-cursor.is-hovering .custom-cursor__handle {
                transform: scale(1.08);
                filter: drop-shadow(0 9px 14px rgba(220, 38, 38, 0.35));
            }

            .custom-cursor.is-clicking .cursor-handle-lever {
                animation: cursorHandleTurn 460ms cubic-bezier(0.2, 0.75, 0.18, 1) both;
            }
        }

        .tap-ripple {
            position: fixed;
            z-index: 99998;
            width: 52px;
            height: 52px;
            border-radius: 999px;
            pointer-events: none;
            background: rgba(220, 38, 38, 0.16);
            border: 1px solid rgba(220, 38, 38, 0.28);
            transform: translate(-50%, -50%) scale(0.38);
            animation: tapRipple 460ms ease-out forwards;
        }

        @keyframes cursorHandleTurn {
            0% {
                transform: rotate(0deg);
            }
            58% {
                transform: rotate(56deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes tapRipple {
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.45);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .custom-cursor.is-clicking .cursor-handle-lever {
                animation: none;
            }

            .tap-ripple {
                animation-duration: 180ms;
            }
        }
        
        .container {
            max-width: 1380px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: #7f1d1d;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.35rem;
            margin-bottom: 10px;
            text-shadow: none;
        }
        
        .header p {
            font-size: 1.1rem;
            color: #475569;
        }

        .language-switch {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 18px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(220, 38, 38, 0.18);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.08);
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: #991b1b;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .lang-btn.active {
            background: #dc2626;
            color: #ffffff;
        }

        .main-card {
            background: white;
            border: 1px solid rgba(220, 38, 38, 0.12);
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(127, 29, 29, 0.14);
            overflow: hidden;
        }
        
        .input-section {
            padding: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #fff7f7 100%);
            border-bottom: 1px solid #e2e8f0;
        }
        
        .input-section h2 {
            color: #1e293b;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-group input,
        .form-group select {
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.18);
        }
        
        .form-group .hint {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
            align-self: center;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.35);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .result-section {
            padding: 40px;
            display: none;
            background: #fbfaf8;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .result-header h2 {
            color: #1e293b;
            font-size: 1.5rem;
        }
        
        .input-summary {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.95rem;
            color: #475569;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        
        .result-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }
        
        .tab-btn:hover:not(.active) {
            border-color: #dc2626;
            color: #dc2626;
        }
        
        .hardware-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-bottom: 30px;
        }

        .hardware-table col:nth-child(1) { width: 30%; }
        .hardware-table col:nth-child(2) { width: 19%; }
        .hardware-table col:nth-child(3) { width: 8%; }
        .hardware-table col:nth-child(4) { width: 8%; }
        .hardware-table col:nth-child(5) { width: 35%; }
        
        .hardware-table th {
            background: #7f1d1d;
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .hardware-table th:first-child {
            border-radius: 12px 0 0 12px;
        }

        .hardware-table th:last-child {
            border-radius: 0 12px 12px 0;
        }
        
        .hardware-table td {
            background: #ffffff;
            padding: 16px;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        .hardware-table td:first-child {
            border-left: 1px solid #e5e7eb;
            border-radius: 12px 0 0 12px;
        }

        .hardware-table td:last-child {
            border-right: 1px solid #e5e7eb;
            border-radius: 0 12px 12px 0;
        }

        .hardware-table th:nth-child(3),
        .hardware-table th:nth-child(4),
        .hardware-table td:nth-child(3),
        .hardware-table td:nth-child(4) {
            text-align: center;
        }
        
        .hardware-table tr:nth-child(even) {
            background: transparent;
        }
        
        .hardware-table tbody tr:hover td {
            background: #f8fafc;
        }
        
        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .category-basic { background: #dbeafe; color: #1e40af; }
        .category-height { background: #fef3c7; color: #92400e; }
        .category-width { background: #d1fae5; color: #065f46; }
        .category-backlock { background: #fce7f3; color: #9d174d; }
        .category-wind { background: #e0e7ff; color: #3730a3; }
        
        .product-code {
            display: inline-block;
            max-width: 100%;
            font-family: 'Courier New', monospace;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 0.9rem;
            color: #111827;
            overflow-wrap: anywhere;
        }
        
        .option-tag {
            display: inline-block;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .option-highlight td {
            background: #fffdfa !important;
            border-color: #fde2bf !important;
            padding: 8px 12px !important;
            vertical-align: middle;
        }

        .option-highlight td:first-child {
            border-left: 3px solid #f59e0b;
        }

        .option-highlight .product-code {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.86rem;
        }

        .option-highlight .note-text {
            color: #64748b;
            font-size: 0.82rem;
            font-style: normal;
            line-height: 1.35;
        }

        .option-highlight td:nth-child(3),
        .option-highlight td:nth-child(4) {
            text-align: center;
        }

        .option-set-row td {
            background: linear-gradient(135deg, #ffffff 0%, #fff7f7 100%) !important;
            border: 1px solid #fecaca !important;
            border-left: 6px solid #dc2626 !important;
            border-radius: 16px !important;
            color: #7f1d1d;
            font-weight: 800;
            letter-spacing: 0;
            padding: 14px 18px !important;
            box-shadow: 0 12px 30px rgba(127, 29, 29, 0.08);
        }

        .option-set-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .option-choice-select {
            min-width: min(430px, 100%);
            max-width: 100%;
            padding: 11px 42px 11px 16px;
            border: 2px solid #dc2626;
            border-radius: 14px;
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, transparent 50%, #7f1d1d 50%),
                linear-gradient(135deg, #7f1d1d 50%, transparent 50%);
            background-position:
                calc(100% - 22px) 50%,
                calc(100% - 15px) 50%;
            background-size: 7px 7px, 7px 7px;
            background-repeat: no-repeat;
            color: #7f1d1d;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
            cursor: pointer;
            appearance: none;
        }

        .option-choice-select:focus {
            border-color: #b91c1c;
            box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.16);
        }
        
        .note-text {
            font-size: 0.85rem;
            color: #64748b;
            font-style: italic;
            line-height: 1.55;
        }

        .option-meta {
            display: inline-block;
            flex: 0 0 auto;
            padding: 2px 8px;
            border-radius: 999px;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #991b1b;
            font-size: 0.76rem;
            font-weight: 700;
            font-style: normal;
        }

        .item-name-line {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            line-height: 1.35;
        }

        .option-name-text {
            min-width: 0;
        }

        .side-option-name {
            color: #7f1d1d;
            font-weight: 800;
        }
        
        .warning-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }
        
        .warning-box p {
            color: #92400e;
        }
        
        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }
        
        .info-box p {
            color: #1e40af;
        }
        
        .export-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .export-btn:hover {
            background: #059669;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .input-section, .result-section {
                padding: 25px;
            }
            
            .hardware-table {
                font-size: 0.9rem;
                min-width: 760px;
            }
            
            .hardware-table th, .hardware-table td {
                padding: 10px;
            }

            .result-section {
                overflow-x: auto;
            }

            .option-set-header {
                align-items: stretch;
            }

            .option-choice-select {
                min-width: 100%;
            }
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #dc2626;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="custom-cursor" id="customCursor" aria-hidden="true">
        <svg class="custom-cursor__handle" viewBox="0 0 96 64" focusable="false">
            <defs>
                <linearGradient id="cursorHandleBase" x1="12" y1="14" x2="38" y2="55" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#fecaca"/>
                    <stop offset="0.3" stop-color="#ef4444"/>
                    <stop offset="1" stop-color="#991b1b"/>
                </linearGradient>
                <linearGradient id="cursorHandleLever" x1="28" y1="15" x2="93" y2="31" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#ffb4b4"/>
                    <stop offset="0.22" stop-color="#ef4444"/>
                    <stop offset="0.68" stop-color="#b91c1c"/>
                    <stop offset="1" stop-color="#7f1d1d"/>
                </linearGradient>
                <linearGradient id="cursorHandleSide" x1="18" y1="14" x2="42" y2="34" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#fecaca"/>
                    <stop offset="0.42" stop-color="#dc2626"/>
                    <stop offset="1" stop-color="#7f1d1d"/>
                </linearGradient>
                <linearGradient id="cursorHandleHighlight" x1="34" y1="18" x2="91" y2="24" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
                    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
                    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>
                <filter id="cursorHandleSoftShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="1.4" dy="2.4" stdDeviation="1.3" flood-color="#7f1d1d" flood-opacity="0.28"/>
                </filter>
            </defs>
            <g filter="url(#cursorHandleSoftShadow)">
                <path d="M21.5 19.2 C21.5 14.8 24.8 12 29.6 12 C34.4 12 37.8 14.8 37.8 19.2 L37.8 38.4 C37.8 42.8 34.4 45.6 29.6 45.6 C24.8 45.6 21.5 42.8 21.5 38.4 Z" fill="url(#cursorHandleBase)" stroke="#7f1d1d" stroke-width="2"/>
                <path d="M25.1 20 C25.1 17 26.8 15.4 29.4 15.4 C32 15.4 33.8 17 33.8 20 L33.8 37.6 C33.8 40.7 32 42.5 29.4 42.5 C26.8 42.5 25.1 40.7 25.1 37.6 Z" fill="#fff1f2" opacity="0.24"/>
                <circle cx="29.6" cy="24" r="5" fill="#7f1d1d" opacity="0.32"/>
                <g class="cursor-handle-lever">
                    <rect x="28" y="16" width="63" height="14" rx="6.5" fill="url(#cursorHandleLever)" stroke="#7f1d1d" stroke-width="2"/>
                    <path d="M34.5 18.9 C48.7 17.1 71.8 17.5 86.1 20.1" fill="none" stroke="#fff7f7" stroke-width="1.6" stroke-linecap="round" opacity="0.42"/>
                    <ellipse cx="90.2" cy="23" rx="4.8" ry="6.7" fill="url(#cursorHandleSide)" stroke="#7f1d1d" stroke-width="1.4"/>
                    <circle cx="31" cy="24" r="4.3" fill="#7f1d1d" opacity="0.46"/>
                </g>
            </g>
        </svg>
    </div>
    <div class="container">
        <div class="header">
            <h1>🏠 HOPO 门窗五金智能选配系统</h1>
            <p>输入门窗尺寸，一键获取专业五金配置方案</p>
            <div class="language-switch" aria-label="Language">
                <button type="button" class="lang-btn active" id="langZh">中文</button>
                <button type="button" class="lang-btn" id="langEn">English</button>
                <button type="button" class="lang-btn" id="langIt">Italiano</button>
            </div>
        </div>
        
        <div class="main-card">
            <div class="input-section">
                <h2 id="formTitle">📋 请输入门窗参数</h2>
                <form id="configForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="windowType" id="windowTypeLabel">门窗类型</label>
                            <select id="windowType" required>
                                <option value="">请选择门窗类型</option>
                                <option value="uc-tilt-turn" selected>UC槽 - 内开内倒窗</option>
                                <option value="hanging-open">悬挂外开窗</option>
                            </select>
                            <span class="hint" id="windowTypeHint">目前支持UC槽内开内倒窗、悬挂外开窗及新增配置方案</span>
                        </div>
                        
                        <div class="form-group" id="slidingConfigGroup" style="display: none;">
                            <label for="slidingConfig" id="slidingConfigLabel">配置方案</label>
                            <select id="slidingConfig">
                                <option value="two-panel">两轨两扇</option>
                                <option value="four-panel">两轨四扇对碰</option>
                            </select>
                            <span class="hint" id="slidingConfigHint">选择推拉门的配置方案</span>
                        </div>
                        
                        <div class="form-group" id="sizeRangeGroup">
                            <label id="sizeRangeLabel">适用范围</label>
                            <div id="sizeRangeDisplay" style="padding: 14px 16px; background: #f1f5f9; border-radius: 10px; border: 2px solid #e2e8f0; color: #475569;">
                                扇宽: 455 ~ 970 mm<br>扇高: 655 ~ 3000 mm
                            </div>
                            <span class="hint" id="sizeRangeHint">若超出范围请联系技术支持</span>
                        </div>
                        
                        <div class="form-group" id="widthInputGroup">
                            <label for="windowWidth" id="widthLabel">门窗宽度 (mm)</label>
                            <input type="number" id="windowWidth" min="455" max="970" placeholder="例如: 600" required>
                            <span class="hint" id="widthHint">输入实际尺寸</span>
                        </div>
                        
                        <div class="form-group" id="heightInputGroup">
                            <label for="windowHeight" id="heightLabel">门窗高度 (mm)</label>
                            <input type="number" id="windowHeight" min="655" max="3000" placeholder="例如: 1200" required>
                            <span class="hint" id="heightHint">输入实际尺寸</span>
                        </div>
                    </div>
                    
                    <div style="text-align: center;">
                        <button type="submit" class="btn-primary" id="queryButton">🔍 查询五金配置</button>
                    </div>
                </form>
            </div>
            
            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <h2 id="resultTitle">✅ 五金配置方案</h2>
                    <div class="input-summary" id="inputSummary"></div>
                </div>
                
                <div id="warningBox"></div>
                <div id="infoBox"></div>
                
                <table class="hardware-table" id="hardwareTable">
                    <colgroup>
                        <col>
                        <col>
                        <col>
                        <col>
                        <col>
                    </colgroup>
                    <thead>
                        <tr>
                            <th id="thProductName">产品名称</th>
                            <th id="thProductCode">产品编号</th>
                            <th id="thUnit">单位</th>
                            <th id="thQty">数量</th>
                            <th id="thNote">备注说明</th>
                        </tr>
                    </thead>
                    <tbody id="hardwareBody">

                .sort((a, b) => b.source.length - a.source.length);
        }

        const MANUAL_TRANSLATION_ENTRIES = buildTranslationEntries(MANUAL_TRANSLATIONS);

        const MANUAL_TRANSLATION_MAP = new Map(
            MANUAL_TRANSLATION_ENTRIES.map(({ normalized, target }) => [normalized, target])
        );

        const ITALIAN_TRANSLATION_ENTRIES = buildTranslationEntries(ITALIAN_TRANSLATIONS);

        const ITALIAN_TRANSLATION_MAP = new Map(
            ITALIAN_TRANSLATION_ENTRIES.map(({ normalized, target }) => [normalized, target])
        );

        const TRANSLATION_TERM_ENTRIES = TRANSLATION_TERMS
            .filter(({ zh, en }) => zh && en)
            .map(({ zh, en }) => ({ source: zh, target: en }))
            .sort((a, b) => b.source.length - a.source.length);

        const TRANSLATION_CACHE = new Map();
        const ITALIAN_TRANSLATION_CACHE = new Map();

        function replaceAllText(text, search, replacement) {
            return text.includes(search) ? text.split(search).join(replacement) : text;
        }

        function replaceResidualChinese(text, translationMap = MANUAL_TRANSLATION_MAP) {
            return String(text).replace(/[\u4e00-\u9fff]+/g, match => translationMap.get(normalizeText(match)) || MANUAL_TRANSLATION_MAP.get(normalizeText(match)) || '');
        }

        function cleanupTranslatedText(text) {
            return String(text)
                .replace(/\s+([,.;:)])/g, '$1')
                .replace(/([(])\s+/g, '$1')
                .replace(/,\s*,/g, ',')
                .replace(/:\s*,/g, ':')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function translateToEnglish(text) {
            if (text === null || text === undefined) return text;
            const raw = String(text);
            if (TRANSLATION_CACHE.has(raw)) return TRANSLATION_CACHE.get(raw);

            let output = raw;
            const normalized = normalizeText(output);
            const exactTranslation = MANUAL_TRANSLATION_MAP.get(normalized);
            if (exactTranslation) {
                TRANSLATION_CACHE.set(raw, exactTranslation);
                return exactTranslation;
            }

            MANUAL_TRANSLATION_ENTRIES.forEach(({ source, target, normalized: termNormalized }) => {
                if (termNormalized === normalized) return;
                output = replaceAllText(output, source, ` ${target} `);
            });

            TRANSLATION_TERM_ENTRIES.forEach(({ source, target }) => {
                output = replaceAllText(output, source, ` ${target} `);
            });

            output = output
                .replace(/（/g, ' (')
                .replace(/）/g, ')')
                .replace(/，/g, ', ')
                .replace(/；/g, '; ')
                .replace(/：/g, ': ')
                .replace(/、/g, ', ')
                .replace(/配置分组:/g, 'Configuration Group:')
                .replace(/表内序号/g, 'Sheet No.')
                .replace(/([\u4e00-\u9fff])([A-Za-z0-9])/g, '$1 $2')
                .replace(/([A-Za-z0-9])([\u4e00-\u9fff])/g, '$1 $2')
                .replace(/([a-z])(\d)/g, '$1 $2')
                .replace(/(\d)([a-z])/g, '$1 $2')
                .replace(/(\d(?:\.\d+)?\s*mm)([A-Za-z])/g, '$1 $2')
                .replace(/(\d+°)([A-Za-z])/g, '$1 $2')
                .replace(/(\d)([A-Z][a-z])/g, '$1 $2')
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/\s+/g, ' ')
                .trim();

            const translated = cleanupTranslatedText(replaceResidualChinese(output));

            TRANSLATION_CACHE.set(raw, translated);
            return translated;
        }

        function translateToItalian(text) {
            if (text === null || text === undefined) return text;
            const raw = String(text);
            if (ITALIAN_TRANSLATION_CACHE.has(raw)) return ITALIAN_TRANSLATION_CACHE.get(raw);

            const normalized = normalizeText(raw);
            const directTranslation = ITALIAN_TRANSLATION_MAP.get(normalized);
            if (directTranslation) {
                ITALIAN_TRANSLATION_CACHE.set(raw, directTranslation);
                return directTranslation;
            }

            let output = translateToEnglish(raw);
            const exactFromEnglish = ITALIAN_TRANSLATION_MAP.get(normalizeText(output));
            if (exactFromEnglish) output = exactFromEnglish;

            ITALIAN_TRANSLATION_ENTRIES.forEach(({ source, target }) => {
                output = replaceAllText(output, source, ` ${target} `);
            });

            const translated = cleanupTranslatedText(replaceResidualChinese(output, ITALIAN_TRANSLATION_MAP));
            ITALIAN_TRANSLATION_CACHE.set(raw, translated);
            return translated;
        }

        function mergeResultItems(items, preserveRows = false) {
            if (preserveRows) return items;

            const mergedItems = {};
            items.forEach(item => {
                let baseName = item.name;
                let isOptionPair = false;
                let pairType = '';

                const lrMatch = item.name.match(/^(.+?)\s*[LR]$/i);
                if (lrMatch) {
                    baseName = lrMatch[1].trim();
                    isOptionPair = true;
                    pairType = 'LR';
                }

                const extMatch = item.name.match(/^(.+?延长端)（.+）$/);
                if (extMatch) {
                    baseName = extMatch[1].trim();
                    isOptionPair = true;
                    pairType = 'EXTEND';
                }

                if (!isOptionPair && item.note && item.note.includes('二选一')) {
                    const bracketMatch = item.name.match(/^(.+?)(可调)?(.+)$/);
                    if (bracketMatch) {
                        const hasPair = items.some(other =>
                            other !== item &&
                            other.note &&
                            other.note.includes('二选一') &&
                            other.name !== item.name &&
                            (other.name.includes(bracketMatch[1]) || item.name.includes(other.name.replace('可调', '')))
                        );
                        if (hasPair) {
                            baseName = item.name.replace('可调', '');
                            isOptionPair = true;
                            pairType = 'NOTE_OPTION';
                        }
                    }
                }

                const key = isOptionPair ? `OPTION_PAIR|${pairType}|${baseName}` : `${item.name}|${item.code}`;
                if (mergedItems[key]) {
                    if (isOptionPair) {
                        mergedItems[key].codes.push(item.code);
                        mergedItems[key].note = '二选一';
                    } else {
                        mergedItems[key].qty += item.qty;
                        const existingNote = mergedItems[key].note || '';
                        if (item.note && !existingNote.includes(item.note)) {
                            mergedItems[key].note = existingNote
                                ? existingNote + '; ' + item.note
                                : item.note;
                        }
                    }
                    return;
                }

                mergedItems[key] = {
                    ...item,
                    name: isOptionPair ? baseName : item.name,
                    codes: [item.code],
                    note: isOptionPair ? '二选一' : item.note
                };
            });

            return Object.values(mergedItems);

        function cleanSideOptionDisplayName(item) {
            let text = cleanConfigLabel(item.optionGroupLabel || item.name || '');

                .replace(/（\s*[左右]\s*）/g, '')
                .replace(/\(\s*[左右]\s*\)/g, '')
                .replace(/[左右](?=（|\(|$|\s)/g, '')

            if (currentLanguage === 'it') return `${categoryName} ${item.optionGroup}: combinazioni selezionabili`;

                const group = groups.get(item.optionScope);
                if (!group.choices.has(item.optionChoice)) {
                    group.choices.set(item.optionChoice, {
                        value: item.optionChoice,
                        label: item.optionChoiceLabel,

        // ============== 自定义执手光标 ==============
        const CUSTOM_CURSOR_INTERACTIVE_SELECTOR = [
            'a[href]',
            'button',
            'select',
            'input',
            'textarea',
            '[role="button"]',
            '[tabindex]:not([tabindex="-1"])',
            '.option-choice-select'
        ].join(', ');

        let customCursorEnabled = false;
        let customCursorSuspended = false;
        let customCursorLastPointerAt = 0;
        let customCursorTurnPromise = Promise.resolve();

        function getCustomCursorTarget(node) {
            return node instanceof Element ? node.closest(CUSTOM_CURSOR_INTERACTIVE_SELECTOR) : null;
        }

        function getNativeSelectControl(node) {
            return node instanceof Element ? node.closest('select') : null;
        }

        function shouldUseCustomCursorPointer(event) {
            return !event.pointerType || event.pointerType === 'mouse';
        }

        function playCustomCursorTurn() {
            const cursor = document.getElementById('customCursor');
            if (!cursor || !customCursorEnabled || customCursorSuspended) return Promise.resolve();

            cursor.classList.remove('is-clicking');
            void cursor.offsetWidth;
            cursor.classList.add('is-clicking');

            customCursorTurnPromise = new Promise(resolve => {
                let finished = false;
                const finish = () => {
                    if (finished) return;
                    finished = true;
                    cursor.classList.remove('is-clicking');
                    resolve();
                };

                cursor.addEventListener('animationend', finish, { once: true });
                window.setTimeout(finish, 520);
            });

            return customCursorTurnPromise;
        }

        function shouldDelayForCustomCursorAction(element) {
            return Boolean(
                element &&
                customCursorEnabled &&
                !customCursorSuspended &&
                Date.now() - customCursorLastPointerAt < 650 &&
                !window.matchMedia('(prefers-reduced-motion: reduce)').matches
            );
        }

        function waitForCustomCursorTurn() {
            return customCursorTurnPromise.catch(() => {});
        }

        function scrollOrNavigateAfterCursorTurn(link) {
            const rawHref = link.getAttribute('href') || '';
            if (!rawHref || rawHref.startsWith('javascript:')) return;

            const targetUrl = new URL(link.href, window.location.href);
            const samePageHash = targetUrl.origin === window.location.origin &&
                targetUrl.pathname === window.location.pathname &&
                targetUrl.search === window.location.search &&
                targetUrl.hash;

            if (samePageHash) {
                const targetId = decodeURIComponent(targetUrl.hash.slice(1));
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth' });
                    return;
                }
            }

            window.location.href = link.href;
        }

        function showTouchRipple(event) {
            if (customCursorEnabled || shouldUseCustomCursorPointer(event) || !getCustomCursorTarget(event.target)) return;

            const ripple = document.createElement('span');
            ripple.className = 'tap-ripple';
            ripple.style.left = `${event.clientX}px`;
            ripple.style.top = `${event.clientY}px`;
            document.body.appendChild(ripple);
            window.setTimeout(() => ripple.remove(), 520);
        }

        function setupCustomCursor() {
            const cursor = document.getElementById('customCursor');
            if (!cursor || !window.matchMedia) return;

            const finePointerQuery = window.matchMedia('(hover: hover) and (pointer: fine)');
            const root = document.documentElement;

            const hideCursor = () => {
                root.classList.remove('custom-cursor-ready');
                cursor.classList.remove('is-visible', 'is-hovering', 'is-clicking');
            };

            const suspendForNativeSelect = selectElement => {
                customCursorSuspended = true;
                hideCursor();

                const resume = () => {
                    customCursorSuspended = false;
                };

                selectElement.addEventListener('blur', resume, { once: true });
                selectElement.addEventListener('change', () => window.setTimeout(resume, 80), { once: true });
            };

            const updateAvailability = () => {
                customCursorEnabled = finePointerQuery.matches;
                customCursorSuspended = false;
                hideCursor();
            };

            const updateCursorPosition = (event) => {
                if (!customCursorEnabled || !shouldUseCustomCursorPointer(event)) return;
                if (customCursorSuspended) {
                    if (getNativeSelectControl(event.target)) return;
                    customCursorSuspended = false;
                }

                cursor.style.setProperty('--cursor-x', `${event.clientX}px`);
                cursor.style.setProperty('--cursor-y', `${event.clientY}px`);
                root.classList.add('custom-cursor-ready');
                cursor.classList.add('is-visible');
                cursor.classList.toggle('is-hovering', Boolean(getCustomCursorTarget(event.target)));
            };

            updateAvailability();
            if (finePointerQuery.addEventListener) {
                finePointerQuery.addEventListener('change', updateAvailability);
            } else if (finePointerQuery.addListener) {
                finePointerQuery.addListener(updateAvailability);
            }

            document.addEventListener('pointermove', updateCursorPosition, { passive: true });
            document.addEventListener('pointerleave', () => cursor.classList.remove('is-visible'));
            document.addEventListener('pointerdown', event => {
                showTouchRipple(event);
                if (!customCursorEnabled || !shouldUseCustomCursorPointer(event) || event.button !== 0) return;

                cursor.style.setProperty('--cursor-x', `${event.clientX}px`);
                cursor.style.setProperty('--cursor-y', `${event.clientY}px`);

                const nativeSelect = getNativeSelectControl(event.target);
                if (nativeSelect) {
                    suspendForNativeSelect(nativeSelect);
                    return;
                }

                root.classList.add('custom-cursor-ready');
                cursor.classList.add('is-visible');

                if (getCustomCursorTarget(event.target)) {
                    customCursorLastPointerAt = Date.now();
                }
                playCustomCursorTurn();
            }, { capture: true, passive: true });

            document.addEventListener('click', event => {
                if (!customCursorEnabled || event.defaultPrevented || event.detail === 0) return;
                if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

                const link = event.target instanceof Element ? event.target.closest('a[href]') : null;
                if (!link || link.target || link.hasAttribute('download')) return;
                if (!shouldDelayForCustomCursorAction(link)) return;

                event.preventDefault();
                waitForCustomCursorTurn().then(() => scrollOrNavigateAfterCursorTurn(link));
            }, { capture: true });
        }

        // 导出功能
        function escapeXml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;')
                .replace(/\r\n|\r|\n/g, '&#10;');

        function getXlsxColumnName(index) {
            let name = '';
            while (index > 0) {
                const remainder = (index - 1) % 26;
                name = String.fromCharCode(65 + remainder) + name;
                index = Math.floor((index - 1) / 26);

        function createWorksheetXml(rows) {
            const columnWidths = [18, 34, 30, 10, 10, 54];
            const colsXml = columnWidths
                .map((width, index) => `<col min="${index + 1}" max="${index + 1}" width="${width}" customWidth="1"/>`)
                .join('');
            const sheetData = rows.map((row, rowIndex) => {
                const rowNumber = rowIndex + 1;
                const cells = row.map((cell, colIndex) => {
                    const ref = `${getXlsxColumnName(colIndex + 1)}${rowNumber}`;
                    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(cell)}</t></is></c>`;
                }).join('');
                return `<row r="${rowNumber}">${cells}</row>`;
            }).join('');

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
    <sheetViews><sheetView workbookViewId="0"/></sheetViews>
    <cols>${colsXml}</cols>
    <sheetData>${sheetData}</sheetData>
</worksheet>`;
        }

        function createCrc32Table() {
            const table = new Uint32Array(256);
            for (let index = 0; index < 256; index += 1) {
                let value = index;
                for (let bit = 0; bit < 8; bit += 1) {
                    value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
                }
                table[index] = value >>> 0;
            }
            return table;
        }

        const ZIP_CRC32_TABLE = createCrc32Table();

        function getCrc32(bytes) {
            let crc = 0xffffffff;
            for (let index = 0; index < bytes.length; index += 1) {
                crc = ZIP_CRC32_TABLE[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function createZip(files, mimeType) {
            const encoder = new TextEncoder();
            const localParts = [];
            const centralParts = [];
            let offset = 0;

            files.forEach(file => {
                const nameBytes = encoder.encode(file.name);
                const dataBytes = typeof file.content === 'string' ? encoder.encode(file.content) : file.content;
                const crc = getCrc32(dataBytes);

                const localHeader = new Uint8Array(30 + nameBytes.length);
                const localView = new DataView(localHeader.buffer);
                localView.setUint32(0, 0x04034b50, true);
                localView.setUint16(4, 20, true);
                localView.setUint16(6, 0, true);
                localView.setUint16(8, 0, true);
                localView.setUint16(10, 0, true);
                localView.setUint16(12, 0, true);
                localView.setUint32(14, crc, true);
                localView.setUint32(18, dataBytes.length, true);
                localView.setUint32(22, dataBytes.length, true);
                localView.setUint16(26, nameBytes.length, true);
                localView.setUint16(28, 0, true);
                localHeader.set(nameBytes, 30);
                localParts.push(localHeader, dataBytes);

                const centralHeader = new Uint8Array(46 + nameBytes.length);
                const centralView = new DataView(centralHeader.buffer);
                centralView.setUint32(0, 0x02014b50, true);
                centralView.setUint16(4, 20, true);
                centralView.setUint16(6, 20, true);
                centralView.setUint16(8, 0, true);
                centralView.setUint16(10, 0, true);
                centralView.setUint16(12, 0, true);
                centralView.setUint16(14, 0, true);
                centralView.setUint32(16, crc, true);
                centralView.setUint32(20, dataBytes.length, true);
                centralView.setUint32(24, dataBytes.length, true);
                centralView.setUint16(28, nameBytes.length, true);
                centralView.setUint16(30, 0, true);
                centralView.setUint16(32, 0, true);
                centralView.setUint16(34, 0, true);
                centralView.setUint16(36, 0, true);
                centralView.setUint32(38, 0, true);
                centralView.setUint32(42, offset, true);
                centralHeader.set(nameBytes, 46);
                centralParts.push(centralHeader);

                offset += localHeader.length + dataBytes.length;
            });

            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const endRecord = new Uint8Array(22);
            const endView = new DataView(endRecord.buffer);
            endView.setUint32(0, 0x06054b50, true);
            endView.setUint16(4, 0, true);
            endView.setUint16(6, 0, true);
            endView.setUint16(8, files.length, true);
            endView.setUint16(10, files.length, true);
            endView.setUint32(12, centralSize, true);
            endView.setUint32(16, offset, true);
            endView.setUint16(20, 0, true);

            return new Blob([...localParts, ...centralParts, endRecord], { type: mimeType });
        }

        function getExportItemName(item) {
            return item.optionKind === 'side'
                ? cleanSideOptionDisplayName(item)
                : getLocalizedItemName(item);
        }

        function buildExcelExportRows(items, width, height, windowType, excelPlan, staticPlan) {
            const rows = [
                [translateDisplayText('HOPO 门窗五金配置清单')],
                []
            ];

            if (excelPlan) {
                rows.push([translateDisplayText('配置分组'), localizeConfigLabel(excelPlan.group)]);
                rows.push([translateDisplayText('配置方案'), localizeConfigLabel(excelPlan.name)]);
            } else {
                rows.push([translateDisplayText('门窗类型'), translateDisplayText(staticPlan.label)]);
                if (staticPlan.requiresSize) {
                    rows.push([translateDisplayText('门窗宽度'), `${width}mm`]);
                    rows.push([translateDisplayText('门窗高度'), `${height}mm`]);
                }
            }

            rows.push([translateDisplayText('生成时间'), new Date().toLocaleString()]);
            rows.push([]);
            rows.push([
                translateDisplayText('类别'),
                translateDisplayText('产品名称'),
                translateDisplayText('产品编号'),
                translateDisplayText('单位'),
                translateDisplayText('数量'),
                translateDisplayText('备注说明')
            ]);

            let activeExportOptionScope = '';
            items.forEach(item => {
                const optionScope = item.optionScope || '';
                if (optionScope && optionScope !== activeExportOptionScope) {
                    rows.push([getExcelOptionGroupTitle(item)]);
                }
                activeExportOptionScope = optionScope;

                const codeDisplay = item.codes ? item.codes.join(' / ') : item.code;
                const groupDisplay = item.optionGroup
                    ? getExcelOptionChoiceLabel(item)
                    : translateDisplayText(item.categoryName || '基础配置');
                rows.push([
                    groupDisplay,
                    getExportItemName(item),
                    codeDisplay,
                    translateUnit(item.unit),
                    item.qty,
                    getLocalizedItemNote(item)
                ]);
            });

            if (currentResult.warnings.length > 0) {
                rows.push([]);
                rows.push([translateDisplayText('注意事项')]);
                currentResult.warnings.forEach(warning => rows.push([translateDisplayText(warning)]));
            }

            if (currentResult.infos.length > 0) {
                rows.push([]);
                rows.push([translateDisplayText('补充说明')]);
                currentResult.infos.forEach(info => rows.push([translateDisplayText(info)]));
            }

            return rows;
        }

        function exportResult() {
            if (!currentResult || !lastRenderContext) return;

            const { width, height, windowType } = lastRenderContext;
            const { visibleItems: items } = getPreparedResultItems(currentResult);
            const excelPlan = isExcelConfigType(windowType) ? (currentExcelPlan || getExcelConfigPlan(windowType)) : null;
            const staticPlan = excelPlan ? null : getStaticPlan(windowType);
            const fileLabel = excelPlan
                ? localizeConfigLabel(excelPlan.name)
                : (staticPlan.requiresSize ? `${width}x${height}` : translateDisplayText(staticPlan.label));
            const exportPrefix = currentLanguage === 'it'
                ? 'Configurazione_ferramenta_HOPO'
                : currentLanguage === 'en'
                    ? 'HOPO_Hardware_Config'
                    : 'HOPO五金配置';

            const rows = buildExcelExportRows(items, width, height, windowType, excelPlan, staticPlan);
            const blob = createXlsxBlob(translateDisplayText('五金配置清单'), rows);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${exportPrefix}_${String(fileLabel).replace(/[\\/:*?"<>|]/g, '_').slice(0, 80)}.xlsx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        var currentExcelPlan = null;
        const EXCEL_RESULT_CACHE = new Map();

        function isExcelConfigType(value) {
            return /^excel-config-\d+$/.test(value || '');
        }

        function getExcelConfigIndex(value) {
            const match = (value || '').match(/^excel-config-(\d+)$/);
            return match ? parseInt(match[1], 10) : -1;
        }

        function getExcelConfigPlan(value) {
            const index = getExcelConfigIndex(value);
            return index >= 0 ? EXCEL_CONFIG_PLANS[index] : null;
        }

        function cleanConfigLabel(text) {
            return (text || '')
                .replace(/（\s*非?主推\s*）/g, '')
                .replace(/\(\s*非?主推\s*\)/g, '')
                .replace(/\s*非?主推\s*/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function localizeConfigLabel(text) {
            const label = cleanConfigLabel(text);
            return currentLanguage === 'zh' ? label : translateDisplayText(label);
        }

        function shouldShowInWindowType(plan) {
            const group = cleanConfigLabel(plan.group);
            const name = cleanConfigLabel(plan.name);
            const text = `${group} ${name}`;
            const hiddenKeywords = [
                '爆款',
                '单品',
                '其他可选滑轮',
                '其他可选配件',
                '其他配件',
                '可选配件',
                '选配件',
                '选配方案',
                '方案选配',
                '数量选配'
            ];

            if (name === '选配' || group === '选配') return false;
            return !hiddenKeywords.some(keyword => text.includes(keyword));
        }

        const VISIBLE_EXCEL_CONFIGS = EXCEL_CONFIG_PLANS
            .map((plan, index) => ({ plan, value: `excel-config-${index}` }))
            .filter(({ plan }) => shouldShowInWindowType(plan));

        const VISIBLE_EXCEL_GROUPS = VISIBLE_EXCEL_CONFIGS.reduce((groups, entry) => {
            if (!groups.has(entry.plan.group)) groups.set(entry.plan.group, []);
            groups.get(entry.plan.group).push(entry);
            return groups;
        }, new Map());

        function appendExcelConfigOptions() {
            const select = document.getElementById('windowType');
            if (!select || select.dataset.excelConfigsLoaded === 'true') return;

            VISIBLE_EXCEL_GROUPS.forEach((entries, groupName) => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = localizeConfigLabel(groupName);
                entries.forEach(({ plan, value }) => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = localizeConfigLabel(plan.name);
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            });

            const hint = select.parentElement.querySelector('.hint');
            if (hint) {
                if (currentLanguage === 'it') {
                    hint.textContent = `Tipi intelligenti originali + ${VISIBLE_EXCEL_CONFIGS.length} configurazioni aggiunte`;
                } else {
                    hint.textContent = currentLanguage === 'en'
                        ? `Original smart types + ${VISIBLE_EXCEL_CONFIGS.length} added configuration plans`
                        : `原有智能计算类型 + ${VISIBLE_EXCEL_CONFIGS.length} 个新增配置方案`;
                }
            }
            select.dataset.excelConfigsLoaded = 'true';
        }

        function parseExcelOptionSerial(serial) {
            const match = String(serial || '').trim().match(/^(\d+)\s*-\s*(\d+)$/);
            return match ? { group: match[1], choice: match[2] } : null;
        }

        function getExcelOptionChoiceName(choice) {
            const index = Number(choice);
            if (Number.isInteger(index) && index >= 1 && index <= 26) {
                return String.fromCharCode(64 + index);
            }
            return String(choice);
        }

        function getSideChoiceInfo(item) {
            const name = String(item.name || '');
            const note = String(item.note || '');
            const sideText = `${name} ${note}`;

            if (/（\s*左\s*）|\(\s*左\s*\)|左边|左侧|左(?=（|\(|$|\s)/.test(sideText)) {
                return { value: 'left', label: '左' };
            }

            if (/（\s*右\s*）|\(\s*右\s*\)|右边|右侧|右(?=（|\(|$|\s)/.test(sideText)) {
                return { value: 'right', label: '右' };
            }

            return null;
        }

        function getSideBaseLabel(item) {
            return cleanConfigLabel(item.name)
                .replace(/（\s*[左右]\s*）/g, '')
                .replace(/\(\s*[左右]\s*\)/g, '')
                .replace(/[左右](?=（|\(|$|\s)/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function cleanSideOptionNote(note) {
            return String(note || '')
                .replace(/[；;，,、\s]*可选项[（(]\s*原表数量为0\s*[)）]/g, '')
                .replace(/\s*\n\s*/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .trim();
        }

        function applySideLabelToNote(note, sideLabel) {
            return cleanSideOptionNote(note)
                .replace(/左边|右边/g, `${sideLabel}边`)
                .replace(/左侧|右侧/g, `${sideLabel}侧`)
                .replace(/（\s*[左右]\s*）/g, `（${sideLabel}）`)
                .replace(/\(\s*[左右]\s*\)/g, `（${sideLabel}）`);
        }

        function canGroupSideItems(leftItem, rightItem) {
            if (!leftItem || !rightItem) return false;
            if (leftItem.optionScope || rightItem.optionScope) return false;
            if ((leftItem.categoryName || '') !== (rightItem.categoryName || '')) return false;

            const leftSide = getSideChoiceInfo(leftItem);
            const rightSide = getSideChoiceInfo(rightItem);
            if (!leftSide || !rightSide || leftSide.value === rightSide.value) return false;

            const leftBase = getSideBaseLabel(leftItem);
            const rightBase = getSideBaseLabel(rightItem);
            return Boolean(leftBase && rightBase && leftBase === rightBase);
        }

        function applySideOptionPairs(items, scopePrefix = 'side-option') {
            const output = items.map(item => ({ ...item }));

            for (let index = 0; index < output.length - 1; index += 1) {
                const first = output[index];
                const second = output[index + 1];
                if (!canGroupSideItems(first, second)) continue;

                const baseLabel = getSideBaseLabel(first);
                const optionScope = `${scopePrefix}|${first.categoryName || ''}|${baseLabel}|${index}`;
                const sharedNote = [first.note, second.note]
                    .map(cleanSideOptionNote)
                    .sort((a, b) => b.length - a.length)[0] || '';
                [first, second].forEach(item => {
                    const side = getSideChoiceInfo(item);
                    Object.assign(item, {
                        optionKind: 'side',
                        optionGroup: '左右',
                        optionGroupLabel: baseLabel,
                        optionChoice: side.value,
                        optionChoiceLabel: side.label,
                        optionSharedNote: applySideLabelToNote(sharedNote, side.label),
                        optionScope
                    });
                });
                index += 1;
            }

            return output;
        }

        function buildExcelOptionItems(rawItems) {
            let activeOption = null;

            const items = rawItems.map(item => {
                const categoryName = item.category || '基础配置';
                const serial = String(item.serial || '').trim();
                const optionSerial = parseExcelOptionSerial(serial);

                if (optionSerial) {
                    activeOption = { ...optionSerial, categoryName };
                } else if (serial) {
                    activeOption = null;
                } else if (activeOption && activeOption.categoryName !== categoryName) {
                    activeOption = null;
                }

                const optionMeta = activeOption && activeOption.categoryName === categoryName
                    ? {
                        optionGroup: activeOption.group,
                        optionChoice: activeOption.choice,
                        optionChoiceLabel: getExcelOptionChoiceName(activeOption.choice),
                        optionScope: `${categoryName}|${activeOption.group}`
                    }
                    : {};

                return {
                    name: item.name,
                    code: item.code,
                    unit: item.unit || '个',
                    qty: item.qty || 1,
                    note: item.note || '',
                    category: 'basic',
                    categoryName,
                    ...optionMeta
                };
            });

            return applySideOptionPairs(items, 'excel-side-option');
        }

        function buildExcelConfigResult(plan) {
            if (EXCEL_RESULT_CACHE.has(plan)) return EXCEL_RESULT_CACHE.get(plan);

            const items = buildExcelOptionItems(plan.items).map(item => {
                let note = item.note || '';
                if (item.categoryName !== '基础配置') {
                    note = note ? `${item.categoryName}：${note}` : item.categoryName;
                }
                return {
                    ...item,
                    note
                };
            });

            const result = {
                basic: items,
                heightAddons: [],
                widthAddons: [],
                backLock: [],
                windBrace: [],
                preserveRows: true,
                warnings: [],
                infos: [
                    `配置分组：${cleanConfigLabel(plan.group)}`,
                    '该方案按配置清单输出；尺寸范围、左右/轻重/颜色等选择请参考备注。'
                ]
            };

            EXCEL_RESULT_CACHE.set(plan, result);
            return result;
        }

        setupCustomCursor();
        appendExcelConfigOptions();
        document.getElementById('langZh').addEventListener('click', () => setLanguage('zh'));
        document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
        document.getElementById('langIt').addEventListener('click', () => setLanguage('it'));
        applyLanguageToStaticText();
        updateSelectLanguage();
        updateFormState();
        // ============== Excel导入配置库结束 ==============</script>
</body>
</html>
